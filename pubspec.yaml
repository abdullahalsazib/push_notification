name: my_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  app_settings: ^9.0.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  provider: ^6.1.5+1
  convert: ^3.1.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  go_router: ^13.0.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  intl: ^0.20.2


  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/DEVs.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logos/splash_logo.png"
  color_dark: "#272727"
  image_dark: "assets/logos/splash_logo.png"
  android_12: true
  ios: true
  web: false
